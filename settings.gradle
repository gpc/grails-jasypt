import org.gradle.api.initialization.resolve.RepositoriesMode

pluginManagement {
    repositories {
        if (System.getenv('INCLUDE_MAVEN_LOCAL')) {
            mavenLocal()
        }
        maven { url = 'https://repo.grails.org/grails/restricted' }
    }

    includeBuild('./build-logic') {
        it.name = 'build-logic'
    }
}

plugins {
    id 'com.gradle.common-custom-user-data-gradle-plugin' version '2.3'
}

def isCI = System.getenv().containsKey('CI')
def isLocal = !isCI
def isReproducibleBuild = System.getenv('SOURCE_DATE_EPOCH') != null
if (isReproducibleBuild) {
    gradle.settingsEvaluated {
        logger.warn(
                '***** Remote Build Cache Disabled due to Reproducible Build *****\n' +
                        'Build date will be set to (SOURCE_DATE_EPOCH={})',
                System.getenv('SOURCE_DATE_EPOCH')
        )
    }
}

buildCache {
    local { enabled = (isLocal && !isReproducibleBuild) || (isCI && isReproducibleBuild) }
}

rootProject.name = 'grails-jasypt-encryption-root'

['core', 'hibernate5', 'hibernate7'].each {
    include("grails-jasypt-encryption-$it")
    project(":grails-jasypt-encryption-$it").projectDir = file("plugins/$it")
}
// Relocation POM for the artifact name used up to version 5
include('grails-jasypt-encryption')
project(':grails-jasypt-encryption').projectDir = file('plugins/relocation')
include('docs')
project(':docs').name = 'grails-jasypt-encryption-docs'
include('code-coverage')

file('examples').listFiles({ it.directory } as FileFilter).each {
    include(it.name)
    project(":$it.name").projectDir = file("examples/$it.name")
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    repositories {
        if (System.getenv('INCLUDE_MAVEN_LOCAL')) {
            mavenLocal()
        }
        maven { url = 'https://repo.grails.org/grails/restricted' }
    }
}
