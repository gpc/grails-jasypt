def docProject = provider {
    project(":${project.name - 'root'}docs")
}
def publishedProjects = provider {
    projectsToPublish.tokenize(',')*.trim().findAll().collect { project(":$it") }
}

tasks.register('cleanDocs', Delete) {
    description = 'Deletes the documentation output'
    group = 'documentation'

    delete(rootProject.layout.projectDirectory.dir('build/docs'))
}

tasks.register('aggregateGroovyApiDoc', Sync) {
    description = 'Copies the Groovy API Documentation of the published projects to build/docs/gapi/<project>'
    group = 'documentation'

    // Gradle 9 forbids resolving another project's configurations from this project,
    // so reuse the projects' own groovydoc output instead of re-running groovydoc here.
    def upstreams = publishedProjects.map { projects ->
        projects.findAll { it.pluginManager.hasPlugin('groovy') }
                .collect { it.tasks.named('groovydoc', Groovydoc) }
    }

    dependsOn(tasks.named('cleanDocs'))
    dependsOn(upstreams)

    into(rootProject.layout.buildDirectory.dir('docs/gapi'))
    upstreams.get().each { upstream ->
        into(upstream.get().project.name - "${project.name - 'root'}") {
            from(upstream.map { it.destinationDir })
        }
    }
}

tasks.register('docs') {
    description = 'Generates the documentation'
    group = 'documentation'

    dependsOn(
            'aggregateGroovyApiDoc',
            docProject.get().tasks.named('asciidoctor')
    )
    finalizedBy(
            'copyAsciiDoctorDocs'
    )
}

tasks.register('copyAsciiDoctorDocs', Copy) {
    group = 'documentation'

    from(docProject.flatMap { it.layout.buildDirectory })
    into(rootProject.layout.buildDirectory)
    include('docs/**')
    includeEmptyDirs = false

}
